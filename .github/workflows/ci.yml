# .github/workflows/ci.yml
name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # docgov extractor raises on shallow clones (R2 guard)
      - name: PROBE origin/main present (tab:07 spec 8; throwaway)
        run: |
          set -x
          git rev-parse HEAD HEAD^1 HEAD^2 || true
          git branch -r
          git rev-parse --verify origin/main || echo "ABSENT origin/main"
          git log --first-parent --oneline -3 origin/main || true
          git log --first-parent --raw --no-abbrev --format=%H -2 origin/main -- tests/corpus-baseline/bfs-*.json | head -20 || true
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[baml,dev,docs,etkl]"
      - name: Generate baml_client (gitignored; 6 test modules import it)
        run: baml-cli generate --from baml_src
      - name: Tests (incl. doc-governance lint)
        run: pytest -q -n auto -m "not serial"
      - name: Tests that read a wall-clock ratio, alone (R307)
        run: pytest -q -m serial
      - name: Site builds strict, internal trees excluded
        run: |
          mkdocs build --strict
          for d in wiki superpowers loops w3id; do
            test ! -d "site/$d" || { echo "LEAK: site/$d published"; exit 1; }
          done
